# Copy this file to secret.yaml and replace with your real values.
# kubectl apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: agriconnect-secrets
type: Opaque
stringData:
  DB_PASSWORD: "REPLACE_WITH_YOUR_DB_PASSWORD"
  JWT_SECRET: "REPLACE_WITH_A_64_CHAR_RANDOM_STRING"
  CORS_ORIGIN: "https://agriconnect.co.ke"
  PAYHERO_API_USERNAME: "REPLACE_WITH_PAYHERO_USERNAME"
  PAYHERO_API_PASSWORD: "REPLACE_WITH_PAYHERO_PASSWORD"
  PAYHERO_ACCOUNT_ID: "REPLACE_WITH_PAYHERO_ACCOUNT_ID"
  PAYHERO_BASIC_AUTH_TOKEN: "REPLACE_WITH_PAYHERO_BASIC_AUTH_TOKEN"
